name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Unit-Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_ENV_VALIDATION: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  db:
    name: RLS- und Policy-Tests (Test-Projekt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    # Destruktive Tests gegen ein gemeinsames Supabase-Projekt: nie parallel.
    concurrency:
      group: db-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Policies anwenden und Tests ausführen
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_MIGRATION_DATABASE_URL: ${{ secrets.TEST_MIGRATION_DATABASE_URL }}
          TUTR_APP_DB_PASSWORD: ${{ secrets.TUTR_APP_DB_PASSWORD }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::warning::TEST_DATABASE_URL nicht gesetzt – RLS-Tests übersprungen."
            exit 0
          fi
          npm run db:policies:test
          npm run db:test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_ENV_VALIDATION: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
